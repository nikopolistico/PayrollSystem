# Render Blueprint: Render → New → Blueprint → pick this repo.
# Creates one web service (API + built Vue app). The database is on Neon.
services:
  - type: web
    name: rcja-payroll
    runtime: node
    region: singapore # closest to PH
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
