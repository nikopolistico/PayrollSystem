# Render Blueprint: Render → New → Blueprint → pick this repo.
# Creates the PostgreSQL database and one web service (API + built Vue app).
databases:
  - name: rcja-payroll-db
    databaseName: payroll
    region: singapore # closest to PH; must match the web service
    plan: free

services:
  - type: web
    name: rcja-payroll
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rcja-payroll-db
          property: connectionString # Internal URL, no SSL needed
      - key: SESSION_SECRET
        generateValue: true
